[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "onfly-policy-copilot"
version = "1.0.0"
description = "Assistente multi-tenant para consulta segura e rastreável de políticas corporativas de viagens."
requires-python = ">=3.11,<3.15"
dependencies = [
    "aio-pika>=9.5,<10",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langchain-core>=1,<2",
    "langchain-ollama>=1,<2",
    "langgraph>=1,<2",
    "langsmith>=0.4,<1",
    "llama-index-core>=0.12,<1",
    "llama-index-vector-stores-qdrant>=0.6,<1",
    "pydantic-settings>=2.7,<3",
    "qdrant-client>=1.15,<2",
    "python-multipart>=0.0.20,<1",
    "redis>=5.2,<8",
    "sentence-transformers>=5.0,<6",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=app --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
