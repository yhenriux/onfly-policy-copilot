services:
  api:
    build:
      context: .
      args:
        APP_VERSION: "1.0.0"
        PROMPT_VERSION: "policy_answer_v2"
    image: onfly-policy-copilot:1.0.0
    environment:
      APP_ENV: development
      APP_VERSION: 1.0.0
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-local-compose-secret-change-me}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_GENERATION_MODEL: llama3.2:3b
      QDRANT_MODE: server
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: onfly_policy_documents_phase3
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      INGESTION_STORAGE_PATH: /app/.local/ingestion
      KNOWLEDGE_GRAPH_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: local-compose-password-change-me
    ports:
      - "${APP_PUBLISHED_PORT:-8010}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ingestion_data:/app/.local/ingestion
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        APP_VERSION: "1.0.0"
        PROMPT_VERSION: "policy_answer_v2"
    image: onfly-policy-copilot:1.0.0
    command: ["python", "-m", "app.worker.ingestion_worker"]
    environment:
      APP_ENV: development
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_GENERATION_MODEL: llama3.2:3b
      QDRANT_MODE: server
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: onfly_policy_documents_phase3
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      INGESTION_STORAGE_PATH: /app/.local/ingestion
      KNOWLEDGE_GRAPH_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: local-compose-password-change-me
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ingestion_data:/app/.local/ingestion
    healthcheck:
      disable: true
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/local-compose-password-change-me
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  qdrant_data:
  rabbitmq_data:
  redis_data:
  ingestion_data:
  neo4j_data:
