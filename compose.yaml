services:
  api:
    build:
      context: .
      args:
        APP_VERSION: "1.0.0"
        PROMPT_VERSION: "policy_answer_v1"
    image: onfly-policy-copilot:1.0.0
    environment:
      APP_ENV: development
      APP_VERSION: 1.0.0
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-local-compose-secret-change-me}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      QDRANT_MODE: server
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_started
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
